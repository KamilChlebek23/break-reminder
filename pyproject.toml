[project]
name = "break-reminder"
version = "0.7.2"
description = "A Windows-11 break reminder for phone-free deep-focus workspaces."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Kamil Chlebek" }]
dependencies = [
    "pynput>=1.8.2",
    "pyside6>=6.11.1",
    "python-dateutil>=2.9.0",
    "pyttsx3>=2.99",
    "pywin32>=311; sys_platform == 'win32'",
    "tzdata>=2024.1",
    "tzlocal>=5.0",
]

[dependency-groups]
dev = [
    "pdoc>=15",
    "pip-audit>=2.7",
    "pip-licenses>=5.0",
    "pre-commit>=4.6.0",
    "pyinstaller>=6.10",
    "pyright>=1.1.410",
    "pytest>=8.3",
    "pytest-qt>=4.4",
    "ruff>=0.6",
    "types-python-dateutil>=2.9.0",
]

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "F", "W", # pycodestyle / pyflakes
    "I",           # isort
    "B",           # bugbear
    "UP",          # pyupgrade
    "SIM",         # simplify
    "D",           # pydocstyle (google convention; see [tool.ruff.lint.pydocstyle])
]
ignore = [
    "E501", # line length is enforced by formatter, not linter
]

[tool.ruff.lint.pydocstyle]
# Enforces the Google-style docstring rule from context/foundation/lessons.md.
# pydocstyle's D-rules already skip leading-underscore symbols, so the lesson's
# "private helpers (leading _) are exempt" carve-out applies automatically.
convention = "google"

[tool.pytest]
# Native TOML config (pytest 9.0+; see #13743 release notes). The legacy
# [tool.pytest.ini_options] table coerces everything through INI-compat
# parsing and silently drops --strict-markers from addopts; the native
# table uses the typed strict_markers boolean instead.
minversion = "9.0"
testpaths = ["tests"]
addopts = ["-q"]
strict_markers = true
markers = [
    "e2e: end-to-end test of a top-three user-visible flow (Phase 4 tier)",
]

[tool.pyright]
# `standard` mode catches the high-value bugs (None-deref, missing
# imports, attribute typos, unused awaits) without forcing every
# function signature to be fully annotated. Bump to "strict" once the
# codebase is fully typed and the third-party stub gaps below are gone.
typeCheckingMode = "standard"
pythonVersion = "3.12"
pythonPlatform = "Windows"
include = ["break_reminder", "tests", "main.py"]
exclude = ["**/__pycache__", "build", "dist", ".venv"]
# Don't fail just because pynput / pyttsx3 / pywin32 ship without
# bundled stubs — they're isolated behind small, typed wrappers in our
# code, and reportMissingTypeStubs would force us to either vendor stubs
# or add `# type: ignore` to every import.
reportMissingTypeStubs = "none"

# ---------------------------------------------------------------------------
# PyInstaller produces dist/BreakReminder/ — see installer/break-reminder.nsi.
# Build it with:
#   uv run pyinstaller --noconfirm --windowed --name BreakReminder \
#                      --collect-submodules pynput \
#                      --collect-data tzdata main.py
#
# --collect-data tzdata is REQUIRED: tzdata is a data-only package whose
# .zoneinfo files PyInstaller does NOT auto-discover. Without it, the
# packaged .exe raises ZoneInfoNotFoundError on every reminder load on
# Windows (zoneinfo falls back to tzdata when the OS lacks system IANA
# data). Local dev + CI both pass without this flag because uv sync
# installs tzdata into the venv; only the first packaged installer build
# after the bugfix-reminder-dst-drift change would hit the failure.
# ---------------------------------------------------------------------------
