name: Release

# Tag-driven release pipeline.
# Push a tag like `v0.1.0` and this workflow will:
#   1. Build the PyInstaller one-folder bundle on a Windows runner.
#   2. Wrap it with NSIS into a Windows installer.
#   3. Publish the installer to a GitHub Release tied to the tag.
#
# The "build" job also runs on every push/PR to master as a CI gate
# (without the publishing step). That's why the publishing step is gated
# on `startsWith(github.ref, 'refs/tags/v')`. The trigger lists `master`
# because this repo's default branch is `master`, not `main` — listing
# `main` here means PRs targeting `master` silently never trigger CI.

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]

permissions:
  contents: write # needed for `gh release create` / `softprops/action-gh-release`

jobs:
  build:
    name: Build & test (windows-latest)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        # Pinned to an exact patch tag (v8.x). astral-sh/setup-uv v8.0.0
        # stopped publishing rolling major/minor tags as a supply-chain
        # hardening move (post-tj-actions incident, 2026-Q1) — see
        # https://github.com/astral-sh/setup-uv/releases/tag/v8.0.0 —
        # so `@v3` / `@v8` resolutions now point at archived SHAs and
        # break the runner with "An action could not be found at the
        # URI ...codeload.github.com/astral-sh/setup-uv/zip/<sha>".
        # Bump the patch component when a newer release is verified.
        uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Lint
        run: uv run ruff check

      - name: Type check
        # pyright is configured in pyproject.toml ([tool.pyright]).
        # `--warnings` would also fail on warnings; we keep it strict on
        # errors only for now and bump if warnings start creeping in.
        run: uv run pyright

      - name: Test (unit)
        # Unit + integration tiers. Excludes the `e2e` marker so a
        # broken cross-cutting flow doesn't mask faster per-module
        # regressions; the e2e step below runs them separately. The
        # pytest `e2e` marker is declared in `pyproject.toml` under
        # `[tool.pytest].markers` and enforced via `strict_markers`.
        run: uv run pytest -m "not e2e"

      - name: Test (e2e)
        # Top-three user-visible flows (Add Reminder, Save Settings
        # interval, Tray Reset) wired through the production app —
        # see `tests/test_*_e2e.py`. Slow relative to the unit tier
        # (each test drives a virtual-clock tick loop) so a separate
        # check mark gives the PR view distinct red/green signals.
        run: uv run pytest -m e2e

      - name: Audit dependencies for known CVEs
        # pip-audit cross-references installed packages against the OSV /
        # PyPI advisory databases. A new advisory in any transitive dep
        # will fail this step; investigate by re-running locally with
        # `uv run pip-audit` and either upgrading or adding a tactical
        # `--ignore-vuln <id>` with a comment explaining why.
        run: uv run pip-audit

      - name: Generate license manifest
        # Produced BEFORE the AGPL gate (next step) so the manifest
        # always lands on disk even when the gate trips. This also
        # sidesteps a subtle GitHub Actions / setup-uv interaction
        # where an ``if: always()`` step on a windows-latest runner
        # can lose the PATH mutation that setup-uv applied — the
        # failure mode is "uv: The term 'uv' is not recognized..."
        # on a step that ran fine when un-gated. By moving manifest
        # generation up the step list (un-gated), uv-on-PATH is
        # guaranteed; the downstream Upload step keeps its
        # ``if: always()`` so the artifact still attaches if the
        # gate fails.
        run: uv run pip-licenses --format=markdown --output-file=licenses.md

      - name: License check (deny AGPL)
        # AGPL is the only license that would force open-sourcing the
        # whole shipped installer. Everything else in the tree is either
        # permissive (MIT/BSD/Apache/PSF) or scoped to a build tool with
        # a runtime exception (PyInstaller is GPLv2 but its bootloader
        # exception lets it produce non-GPL binaries — the installer is
        # safe). LGPL deps (PySide6, pynput) are fine because Python's
        # import system is dynamic linking by definition.
        run: uv run pip-licenses --fail-on="AGPL"

      - name: Upload license manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: license-manifest
          path: licenses.md
          if-no-files-found: warn

      - name: Build PyInstaller bundle
        run: |
          uv run pyinstaller `
            --noconfirm `
            --windowed `
            --name BreakReminder `
            --collect-submodules pynput `
            main.py

      - name: pynput submodule smoke test (bundled binary)
        # Catches the silent-failure mode where --collect-submodules pynput
        # missed a platform-specific submodule. The bundled binary is
        # invoked with --self-test, which forces pynput's keyboard / mouse
        # Listener classes to dispatch to their _win32 backends — exactly
        # what PyInstaller has to bundle. Exit code propagates to CI.
        run: |
          .\dist\BreakReminder\BreakReminder.exe --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install NSIS
        # NSIS is no longer shipped on the windows-latest image (it was
        # removed during the 2024-2025 image-size cleanup). Chocolatey IS
        # preinstalled, so we use it. The GITHUB_PATH append is required
        # because choco's own PATH update doesn't propagate to the
        # already-running job — subsequent steps would still see the old
        # PATH and `makensis` would still not resolve.
        run: |
          choco install nsis -y --no-progress
          Add-Content $env:GITHUB_PATH "C:\Program Files (x86)\NSIS"

      - name: Verify NSIS install
        run: makensis /VERSION

      - name: Build installer
        run: makensis installer\break-reminder.nsi

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: BreakReminder-installer
          path: installer/BreakReminder-Setup-*.exe
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download installer artifact
        uses: actions/download-artifact@v4
        with:
          name: BreakReminder-installer
          path: installer-out

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: installer-out/BreakReminder-Setup-*.exe
          generate_release_notes: true
          draft: false
          prerelease: false
