name: Docs

# Auto-publishes the pdoc HTML documentation site for the `break_reminder`
# package to GitHub Pages on every push to `master`. Sibling to
# `release.yml`; the two never block each other — a docs build failure
# does not stop a release, and vice versa.
#
# One-time repo setup required: Settings → Pages → Source = "GitHub
# Actions" (not the legacy `gh-pages` branch source). Until that toggle
# is flipped the `deploy` job fails with "Get Pages site failed".

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  # Trio required by actions/deploy-pages@v4.
  contents: read
  pages: write
  id-token: write

concurrency:
  # Serialize Pages deploys without aborting one already in flight; two
  # near-simultaneous pushes to master both publish, last-write-wins.
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build pdoc site (ubuntu-latest)
    runs-on: ubuntu-latest

    env:
      # pdoc *imports* every module it documents in order to introspect
      # signatures and docstrings. PySide6's QtGui touches Qt's QPA on
      # import; without an offscreen platform plugin Qt would try to
      # connect to an X display that doesn't exist on the runner and
      # the import would still fail even after libEGL is installed.
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt6 + pynput runtime libs (headless)
        # PySide6 wheels dynamically link libEGL / libGL / libxkbcommon
        # at import time, and pynput needs libX11 / libXi / libXtst.
        # ubuntu-latest does NOT ship these by default, so pdoc's
        # `import break_reminder.app` aborts with
        # `ImportError: libEGL.so.1: cannot open shared object file`.
        # The Qt6 lib set below is the conventional headless-PySide6
        # bundle (libxcb-cursor0 is the Qt 6.5+ addition; without it
        # the xcb platform plugin fails to load on a future code path
        # even though offscreen is the active QPA for this build).
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libegl1 \
            libgl1 \
            libxkbcommon0 \
            libdbus-1-3 \
            libfontconfig1 \
            libxcb-cursor0 \
            libxi6 \
            libxtst6

      - name: Install uv
        # Same pin as release.yml — see the supply-chain comment block
        # there for why setup-uv tags are pinned to exact patch versions
        # rather than `@v8`. Bump the patch component when a newer
        # release is verified.
        uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Build documentation
        # pdoc only auto-recurses into modules that the package has
        # imported into its namespace. `break_reminder/__init__.py`
        # exports only `__version__`, so passing the bare package name
        # would render a single near-empty index page. The explicit
        # subpackage list below makes pdoc walk each subpackage's
        # filesystem tree (every `.py` under `notifications/`, `ui/`,
        # `storage/` is included). Top-level modules (`app`, `activity`,
        # `scheduler`) need their own positional args for the same
        # reason. `-d google` matches the docstring convention enforced
        # by ruff's `D` rule in pyproject.toml. `main.py` and `tests/`
        # are intentionally excluded — `main.py` is a thin entry that
        # delegates to `break_reminder.app.main`, and tests are
        # internal scaffolding.
        run: |
          uv run pdoc \
            -o site \
            -d google \
            break_reminder \
            break_reminder.activity \
            break_reminder.app \
            break_reminder.scheduler \
            break_reminder.notifications \
            break_reminder.ui \
            break_reminder.storage

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
